services:
  # ---------------------------------------------------------------------------
  # Local Development Service (with live-reload via volume mount)
  # ---------------------------------------------------------------------------
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: calculator-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules

  # ---------------------------------------------------------------------------
  # Production-like Service (optimized, standalone)
  # ---------------------------------------------------------------------------
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: calculator-api-prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    profiles:
      - prod
